}</script><script>
 'use strict';
const LIB=JSON.parse(document.getElementById('libraryData').textContent);
let category='all',query='',sort='title';
const byId=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:'#';}catch{return '#';}};
const fileIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></svg>';
function drawNav(){byId('categoryNav').innerHTML=`<button type="button" class="nav-btn all ${category==='all'?'active':''}" data-category="all" aria-pressed="${category==='all'}"><span>全部文献</span><span class="num">${LIB.items.length}</span></button>`+LIB.collections.map(g=>`<button type="button" class="nav-btn ${category===g.key?'active':''}" data-category="${esc(g.key)}" aria-pressed="${category===g.key}"><span>${esc(g.name)}</span><span class="num">${g.items.length}</span></button>`).join('');}
function matches(p){const names=p.groups.map(k=>LIB.collections.find(g=>g.key===k)?.name||'').join(' ');const hay=[p.title,...p.authors,p.source,p.year,names,...p.tags].join(' ').toLocaleLowerCase();return(category==='all'||p.groups.includes(category))&&(!query||hay.includes(query.toLocaleLowerCase()));}
function paperHTML(p){return `<article class="paper" data-key="${esc(p.key)}"><span class="paper-icon" aria-hidden="true">${fileIcon}</span><div class="paper-main"><a class="title" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener noreferrer">${esc(p.title)}</a><div class="paper-meta"><span>${esc(p.year)}</span><span class="source-tag">${esc(p.source)}</span><span class="paper-authors">${esc(p.authorLine)}</span></div></div></article>`;}
function render(){const filtered=LIB.items.filter(matches).sort((a,b)=>sort==='date'?b.date.localeCompare(a.date)||a.title.localeCompare(b.title):a.title.localeCompare(b.title));let blocks='';for(const g of LIB.collections){const list=filtered.filter(p=>p.groups.includes(g.key));if(list.length)blocks+=`<section class="group"><div class="group-heading"><h2>${esc(g.name)}</h2><span>${list.length} 篇</span></div>${list.map(paperHTML).join('')}</section>`;}byId('paperList').innerHTML=blocks||'<section class="empty"><h2>没有找到匹配的文献</h2><p>可以换个关键词，或清除分类和搜索条件。</p><button type="button" id="resetFilters">清除全部筛选</button></section>';byId('resultCount').textContent=`显示 ${filtered.length} / ${LIB.items.length} 篇文献`;const selected=LIB.collections.find(g=>g.key===category);byId('pageTitle').textContent=selected?selected.name:'文献目录';byId('pageIntro').textContent=selected?`本分类收录 ${selected.items.length} 篇文献，分类归属与 Zotero 一致。`:'按分类查找文献，点击标题打开原文。';byId('clearSearch').classList.toggle('visible',!!query);}
byId('categoryNav').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(b){category=b.dataset.category;drawNav();render();byId('categoryNav').querySelector(`[data-category="${category}"]`)?.focus({preventScroll:true});}});
byId('search').addEventListener('input',e=>{query=e.target.value.trim();render();});
byId('clearSearch').addEventListener('click',()=>{query='';byId('search').value='';render();byId('search').focus();});
byId('sort').addEventListener('change',e=>{sort=e.target.value;render();});
byId('paperList').addEventListener('click',e=>{if(e.target.closest('#resetFilters')){query='';category='all';byId('search').value='';drawNav();render();byId('search').focus();}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();byId('search').focus();}});
drawNav();render();
</script></body></html>
